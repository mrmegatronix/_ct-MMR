<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMR - Slide Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap" rel="stylesheet">
    <script src="config.js"></script>
    <style>
        body {
            background-color: #070a13;
            color: white;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }
        h1 {
            text-align: center;
            color: #fbbf24;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .preview-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .slide-container {
            width: 960px;
            height: 540px;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            border: 4px solid #334155;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transform-origin: top center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .slide-label {
            font-size: 1.5rem;
            font-weight: 800;
            color: #94a3b8;
            margin-bottom: -20px;
            z-index: 10;
        }
        .slide-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .slide-title { font-size: 6rem; font-weight: 900; margin: 0; line-height: 1.1; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .slide-subtitle { font-size: 2.2rem; font-weight: 700; color: #fbbf24; margin-top: 1rem; text-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .slide-advert-p100 { color: #ef4444; }
        .slide-advert-p50 { color: #3b82f6; }
        .slide-advert-p25 { color: #10b981; }
        .slide-advert-total { color: #a855f7; }
        .slide-advert-pool { color: #f59e0b; }
        
        .image-slide {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        #slides-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="preview-header">
        <h1>Dynamic Slide Preview</h1>
        <p style="color: #94a3b8;">This page shows a live preview of all slides currently generated by the system.</p>
        <button onclick="window.location.href='admin.html'" style="padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px;">Return to Admin</button>
    </div>

    <div id="slides-wrapper">
        <p style="color: #94a3b8;">Loading slides from Firebase...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        let db = null;
        
        let localState = {
            slides: [
                { type: "countdown", title: "Time Until Draw", duration: 30000 }
            ],
            draw: {
                activeEvent: 'thursday',
                thursday: {
                    cfgPrizes100: 10,
                    cfgPrizes50: 16,
                    cfgPrizes25: 40,
                    prizes100: 10,
                    prizes50: 16,
                    prizes25: 40,
                    drawnNumbers: [],
                    prizesLeft: 66,
                    enabled: true
                },
                sunday: {
                    enabled: false
                }
            }
        };

        const bc = new BroadcastChannel('mmr_channel');
        bc.onmessage = (event) => {
            if (event.data.type === 'state_update') {
                localState = { ...localState, ...event.data.state };
                renderPreviews();
            }
        };


        function loadFirebaseConfig() {
            const fbConfig = localStorage.getItem('mmr_firebase_config');
            if (fbConfig) {
                try {
                    const cfg = JSON.parse(fbConfig);
                    if (cfg && cfg.databaseURL) {
                        const app = initializeApp(cfg);
                        db = getDatabase(app);
                        const stateRef = ref(db, 'state');
                        onValue(stateRef, (snapshot) => {
                            if (snapshot.exists()) {
                                localState = snapshot.val();
                                renderPreviews();
                            }
                        });
                        return true;
                    }
                } catch (e) { console.error("Firebase config error:", e); }
            }
            return false;
        }

        function loadLocalState() {
            const ls = localStorage.getItem('mmr_state_v5');
            if (ls) {
                try {
                    localState = { ...localState, ...JSON.parse(ls) };
                } catch(e) {}
            }
            renderPreviews();
        }

        function getActiveDrawData(drawState) {
            if (!drawState) return {};
            const activeEvtName = drawState.activeEvent || 'thursday';
            return drawState[activeEvtName] || {};
        }
        
        function getNZDate() {
            return new Date(new Date().toLocaleString("en-US", {timeZone: "Pacific/Auckland"}));
        }

        function renderPreviews() {
            const state = localState;
            const slidesData = state.slides || [];
            const disabledList = state.disabledSlides || [];
            const visibleSlides = slidesData.filter(s => !disabledList.includes(s.title) && s.type !== 'avatar');
            
            const activeEvtData = getActiveDrawData(state.draw);
            const t100 = Number(activeEvtData.cfgPrizes100 ?? activeEvtData.prizes100 ?? 10);
            const t50 = Number(activeEvtData.cfgPrizes50 ?? activeEvtData.prizes50 ?? 16);
            const t25 = Number(activeEvtData.cfgPrizes25 ?? activeEvtData.prizes25 ?? 40);
            
            const isSundayEnabled = !!(state.draw && state.draw.sunday && state.draw.sunday.enabled);
            const isThursdayEnabled = !!(state.draw && state.draw.thursday && state.draw.thursday.enabled !== false);
            let activeEvtName = (state.draw && state.draw.activeEvent) || 'thursday';
            
            let isCurrentEventEnabled = activeEvtName === 'sunday' ? isSundayEnabled : isThursdayEnabled;
            if (activeEvtName === 'sunday' && !isSundayEnabled && isThursdayEnabled) { activeEvtName = 'thursday'; isCurrentEventEnabled = true; } 
            else if (activeEvtName === 'thursday' && !isThursdayEnabled && isSundayEnabled) { activeEvtName = 'sunday'; isCurrentEventEnabled = true; }
            
            const isSunday = activeEvtName === 'sunday';
            const targetDay = isSunday ? 0 : 4; 
            const dayNameUpper = isSunday ? 'SUNDAYS' : 'THURSDAYS';
            const dayNameCap = isSunday ? "Sunday's" : "Thursday's";
            const defaultSaleTime = isSunday ? "1:00PM" : "5:30PM";
            const defaultDrawTime = isSunday ? "2:30PM" : "7:00PM";

            const nzDate = getNZDate();
            const day = nzDate.getDay();
            const hour = nzDate.getHours();

            const activeEvt = (state.draw && state.draw[activeEvtName]) || {};
            const isDrawFinished = activeEvt.prizesLeft === 0 && (activeEvt.drawnNumbers || []).length > 0;
            const isAfter8PM = hour >= 20;

            const vCount = Number(activeEvtData.cfgVouchersCount ?? 0);
            const vValue = Number(activeEvtData.cfgVouchersValue ?? 0);
            const totalPrizes = t100 + t50 + t25 + vCount;
            const totalPool = (t100 * 100) + (t50 * 50) + (t25 * 25) + vValue;

            const isTBC = isDrawFinished || (t100 === 0 && t50 === 0 && t25 === 0 && vCount === 0);

            const t100Str = isTBC ? "T.B.C." : String(t100);
            const t50Str = isTBC ? "T.B.C." : String(t50);
            const t25Str = isTBC ? "T.B.C." : String(t25);
            const vCountStr = isTBC ? "T.B.C." : String(vCount);
            const totalPrizesStr = isTBC ? "T.B.C." : String(totalPrizes);
            const totalPoolStr = isTBC ? "T.B.C." : "$" + totalPool.toLocaleString('en-NZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            let isTonight = (day === targetDay) && !isAfter8PM && !isDrawFinished;

            const ticketsWording = isTonight ? `TONIGHT FROM ${defaultSaleTime}` : (day === (targetDay - 1 + 7) % 7) ? `TOMORROW FROM ${defaultSaleTime}` : `${dayNameUpper} FROM ${defaultSaleTime}`;
            const drawWording = isTonight ? `TONIGHT AT ${defaultDrawTime}` : (day === (targetDay - 1 + 7) % 7) ? `TOMORROW AT ${defaultDrawTime}` : `${dayNameUpper} AT ${defaultDrawTime}`;
            const poolWording = isTonight ? "tonight's" : (day === (targetDay - 1 + 7) % 7) ? "tomorrow's" : dayNameCap;

            const advertSlides = [];
            const drawType = activeEvt.type || 'full';
            
            if (isCurrentEventEnabled && (drawType === 'full' || drawType === 'manual')) {
                if (t100 > 0 || isTBC) advertSlides.push({ title: `${t100Str} x $100`, subtitle: "🥩 Premium Assorted Meat Trays to be won!! 🥩", type: "advert", advertType: "p100" });
                if (t50 > 0 || isTBC) advertSlides.push({ title: `${t50Str} x $50 TRAYS`, subtitle: "🍗 Premium Assorted Meat Trays to be won!! 🍗", type: "advert", advertType: "p50" });
                if (t25 > 0 || isTBC) advertSlides.push({ title: `${t25Str} x $25 TRAYS`, subtitle: "🥓 Premium Assorted Meat Trays to be won!! 🥓", type: "advert", advertType: "p25" });
                if (vCount > 0) advertSlides.push({ title: `${vCountStr} x VOUCHERS`, subtitle: "🎫 Vouchers to be won!! 🎫", type: "advert", advertType: "vouchers" });
                
                if (totalPrizes > 0 || isTBC) {
                    advertSlides.push({ title: `TOTAL PRIZES: ${totalPrizesStr}`, subtitle: "🍖 Premium Assorted Meat Trays must be won!! 🍖", type: "advert", advertType: "total" });
                    advertSlides.push({ title: `A MASSIVE ${totalPoolStr}`, subtitle: `in ${poolWording} ${totalPrizesStr} prizes!`, type: "advert", advertType: "pool" });
                }
                advertSlides.push({ title: "TICKETS ON SALE", subtitle: `🎟️ ${ticketsWording} 🎟️`, type: "advert", advertType: "tickets" });
                advertSlides.push({ title: "MONSTER MEAT RAFFLE", subtitle: `🔥 DRAW STARTS ${drawWording} 🔥`, type: "advert", advertType: "draw_time" });
            }

            const finalSlides = [...visibleSlides, ...advertSlides];
            const wrapper = document.getElementById('slides-wrapper');
            if (drawType === 'generic') {
                document.querySelector('.preview-header p').innerHTML += '<br><strong style="color:#fbbf24;">(Note: You are currently set to a Generic Draw, so the Meat Pack advert slides are automatically hidden.)</strong>';
            } else if (!isCurrentEventEnabled) {
                document.querySelector('.preview-header p').innerHTML += '<br><strong style="color:#ef4444;">(Note: The active draw is currently disabled in Admin, so Prize advert slides are hidden.)</strong>';
            }

            
            if (finalSlides.length === 0) {
                wrapper.innerHTML = '<h2 style="color:#ef4444;">No slides are currently active or generated.</h2>';
                return;
            }

            let html = '';
            finalSlides.forEach((s, idx) => {
                let innerHtml = '';
                if (s.type === 'advert') {
                    innerHtml = `
                        <div class="slide-content">
                            <h2 class="slide-title slide-advert-${s.advertType || ''}">${s.title}</h2>
                            <p class="slide-subtitle">${s.subtitle || ''}</p>
                        </div>
                    `;
                } else if (s.type === 'countdown') {
                    innerHtml = `
                        <div class="slide-content">
                            <h2 class="slide-title" style="color:#fbbf24; font-size:4rem;">LIVE COUNTDOWN CLOCK</h2>
                            <p class="slide-subtitle" style="color:#fff;">(Timer will display here on TV)</p>
                        </div>
                    `;
                } else {
                    const src = s.src || (s.file ? `assets/${s.file}` : '');
                    if (s.type === 'video' || (src && src.match(/\.(mp4|webm|mov)$/i))) {
                        innerHtml = `<video class="image-slide" src="${src}" loop muted autoplay playsinline></video><div class="slide-content" style="background: rgba(0,0,0,0.4);"><h2 class="slide-title" style="color:white; text-shadow: 0 4px 10px black;">${s.title}</h2></div>`;
                    } else {
                        innerHtml = `<img class="image-slide" src="${src}" alt="${s.title}" onerror="this.style.display='none'"><div class="slide-content" style="background: rgba(0,0,0,0.4);"><h2 class="slide-title" style="color:white; text-shadow: 0 4px 10px black;">${s.title}</h2></div>`;
                    }
                }

                html += `
                    <div class="slide-label">Slide ${idx + 1}: ${s.title}</div>
                    <div class="slide-container">
                        ${innerHtml}
                    </div>
                `;
            });
            wrapper.innerHTML = html;
        }

        if (!loadFirebaseConfig()) {
            loadLocalState();
            // Poll for updates if no firebase
            setInterval(loadLocalState, 2000);
        }

    </script>
</body>
</html>
