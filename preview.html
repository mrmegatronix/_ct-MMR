<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMR - Grid Preview</title>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root {
            --background: 223 39% 7%;
            --border: 217.2 32.6% 17.5%;
            --destructive: 0 62.8% 30.6%;
            --destructive-foreground: 0 0% 98%;
            --radius: 0.5rem;
        }
        body {
            margin: 0;
            background-color: hsl(var(--background));
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 15px 30px;
            box-sizing: border-box;
            border-bottom: 2px solid hsl(var(--border));
        }
        h1 { margin: 0; font-size: 1.5rem; color: #fbbf24; text-transform: uppercase; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            height: 2.25rem;
            padding: 0 1rem;
            cursor: pointer;
            border: 1px solid transparent;
            text-decoration: none;
            color: hsl(var(--destructive-foreground));
            background: hsl(var(--destructive));
        }
        .btn:hover { opacity: 0.9; }
        iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <h1>🖼️ Promotional Slides Grid Preview</h1>
        <button class="btn" onclick="window.location.href='admin.html'">Return to Admin</button>
    </div>
    <iframe src="index.html?grid=true"></iframe>
</body>
</html>
