<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMR - Live Visual Preview</title>
    <style>
        body {
            background-color: #070a13;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-bar {
            width: 100%;
            max-width: 1920px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 15px 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 2px solid #334155;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #fbbf24;
            text-transform: uppercase;
        }
        .controls {
            display: flex;
            gap: 15px;
        }
        button {
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        button:hover { background: #2563eb; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        
        /* Iframe wrapper for 16:9 scaling */
        .preview-wrapper {
            position: relative;
            width: 100%;
            max-width: 1280px; /* Base width */
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            border: 4px solid #334155;
        }
        
        #tv-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            border: none;
            transform-origin: top left;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>📺 Live Visual TV Preview</h1>
        <div class="controls">
            <button onclick="sendCommand('prev')">⏮ Prev Slide</button>
            <button onclick="sendCommand('toggle')">⏸ Pause / Auto</button>
            <button onclick="sendCommand('next')">Next ⏭</button>
            <button onclick="window.location.href='admin.html'" class="btn-danger">Return to Admin</button>
        </div>
    </div>
    
    <p style="color: #94a3b8; margin-top: -10px; margin-bottom: 20px; text-align: center;">
        This is exactly what is playing on the main TV right now.<br>
        If draws are disabled, it will ONLY cycle the promotional slides (Countdown, Tickets, Meat Trays, etc).
    </p>

    <div class="preview-wrapper" id="wrapper">
        <iframe id="tv-frame" src="index.html"></iframe>
    </div>

    <script>
        // Scale iframe to fit wrapper perfectly
        function resizeIframe() {
            const wrapper = document.getElementById('wrapper');
            const frame = document.getElementById('tv-frame');
            const scale = wrapper.clientWidth / 1920;
            frame.style.transform = `scale(${scale})`;
        }
        
        window.addEventListener('resize', resizeIframe);
        window.addEventListener('load', resizeIframe);
        
        // Setup BroadcastChannel to send commands to the iframe
        const bc = new BroadcastChannel('mmr_state_channel');
        
        function sendCommand(cmd) {
            bc.postMessage({
                type: 'SLIDE_CMD',
                payload: {
                    cmd: cmd,
                    ts: Date.now()
                }
            });
            
            // If they are controlling slides, make sure it forces the slides view
            bc.postMessage({
                type: 'STATE_UPDATE',
                payload: { activeView: 'slides' }
            });
        }
    </script>
</body>
</html>
